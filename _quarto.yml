format:
  html:
    theme: [cosmo, custom.css]
    toc: true
    # Load Supabase + your config in <head>, on every page:
    include-in-header:
      - _includes/head.html
    # Auth: injects sign-in controls into the navbar dropdown:
    include-before-body:
      - _includes/auth-widget.html
    # The page-time + action tracker, on every page:
    include-after-body:
      - _includes/track.html
      # The floating Metronome and Drone, in the navbar on every page:
      - _includes/practice-widgets.html
      # Hide/show the left sidebar (remembered), and only the current page's navbar tab blue:
      - _includes/sidebar-toggle.html
      - _includes/nav-current.html
