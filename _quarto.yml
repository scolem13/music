project:
  type: website
  # Only .qmd pages are rendered, so the root .md dev notes (CLAUDE.md, in-progress notes), reports/ and research_notes/ stay off the site; archive/ is excluded too (see archive/README.md).
  render:
    - "**/*.qmd"
    - "!archive/"
  # A fixed port for `quarto preview`, so the lyrics site (run locally) knows where to find the local Backing Track.
  preview:
    port: 4455
  # Files that must be copied to the output as-is (not rendered):
  resources:
    - config.js
    - track.js
    - apps/**

website:
  title: "Music Practice"
  # No search key: letters are shortcuts on several pages (S stamps a section in Timestamp Notes). Click the navbar's search.
  search:
    keyboard-shortcut: []
  # The Lessons read like a book: parts by topic, Previous / Next at the foot of each page.
  page-navigation: true
