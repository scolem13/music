<!-- Both sidebars fold away, each from its own button in the navbar, and each choice is remembered:
     the left (site menu) from a button at the navbar's left, the right ("On this page" and page tools) from one at its right.
     A sidebar with nothing in it is not shown at all and gets no button: the left when the page is in no sidebar section,
     the right when it has no section list and no tool has put anything there (scripts that add to it later, the score
     page's spacing slider or the My report box, bring it back: it is watched). The page body takes the freed room; the
     grids for each case are in custom.css ("Sidebars"). Below 992px Quarto already tucks both away itself, so the buttons hide. -->
<script>
(function () {
  "use strict";
  var SIDES = {
    left: { key: "site-nav", cls: "sidebar-hidden", empty: "no-left-sidebar", id: "quarto-sidebar", icon: "bi-layout-sidebar", name: "menu" },
    right: { key: "site-margin", cls: "margin-hidden", empty: "no-right-sidebar", id: "quarto-margin-sidebar", icon: "bi-layout-sidebar-reverse", name: "side panel" }
  };
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  // empty: no links in the site menu; in the right sidebar, nothing but an empty "On this page" list
  function isEmpty(side, el) {
    if (!el) return true;
    if (side === "left") return !el.querySelector("a.sidebar-link, .sidebar-item a[href]");
    if (el.querySelector("#TOC a, nav[role=doc-toc] a")) return false;
    return ![].some.call(el.children, function (c) {
      if (c.matches("nav[role=doc-toc], #TOC, .quarto-margin-spacer")) return false;
      return !!(c.textContent.trim() || c.querySelector("input, button, select, canvas, svg, img"));   // content, not visibility (a hidden sidebar's children are hidden too)
    });
  }

  function boot() {
    var bar = document.querySelector("#quarto-header .navbar-container");
    Object.keys(SIDES).forEach(function (side) {
      var S = SIDES[side], el = document.getElementById(S.id), button = null;
      function set(hidden) {
        document.body.classList.toggle(S.cls, hidden);
        if (!button) return;
        var label = (hidden ? "Show the " : "Hide the ") + S.name;
        button.title = label; button.setAttribute("aria-label", label); button.setAttribute("aria-expanded", String(!hidden));
      }
      function refresh() {
        var empty = isEmpty(side, el);
        document.body.classList.toggle(S.empty, empty);
        if (button) button.hidden = empty;
      }
      if (el && bar) {
        button = document.createElement("button"); button.type = "button"; button.className = "sidebar-toggle sidebar-toggle-" + side;
        var icon = document.createElement("i"); icon.className = "bi " + S.icon; button.appendChild(icon);
        // the left button first in the navbar; the right one at the navbar's right end, after the last menu (the collapsible part)
        if (side === "left") bar.insertBefore(button, bar.firstChild);
        else (document.querySelector("#quarto-header .navbar-collapse") || bar).appendChild(button);
        button.addEventListener("click", function () {
          var hidden = !document.body.classList.contains(S.cls);
          set(hidden); store(S.key, hidden ? "hidden" : "shown"); button.blur();
          window.dispatchEvent(new Event("resize"));   // anything laid out against the old width re-measures
        });
      }
      set(store(S.key) === "hidden");
      refresh();
      if (el) new MutationObserver(function () { var was = document.body.classList.contains(S.empty); refresh(); if (was !== document.body.classList.contains(S.empty)) window.dispatchEvent(new Event("resize")); })
        .observe(el, { childList: true, subtree: true });
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
