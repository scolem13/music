<!-- Marks the navbar tab whose link is this page with .nav-current, so only
     that tab is coloured. Quarto's own .active also lights a tab for pages
     beneath it, which is quietened in the stylesheet. -->
<script>
(function () {
  "use strict";
  function norm(path) { return path.replace(/\/index\.html$/, '/').replace(/\.html$/, ''); }
  function boot() {
    var here = norm(location.pathname);
    // A dropdown tab's own link is "#" (it would match every page): it is current when its menu holds this page.
    function isHere(a) {
      var h = a.getAttribute('href');
      if (!h || h.charAt(0) === '#') return false;
      return norm(new URL(h, location.href).pathname) === here;
    }
    document.querySelectorAll('#quarto-header .navbar-nav .nav-link[href]').forEach(function (a) {
      var menu = a.classList.contains('dropdown-toggle') && a.parentNode.querySelector('.dropdown-menu');
      var current = menu ? Array.prototype.some.call(menu.querySelectorAll('a.dropdown-item[href]'), isHere) : isHere(a);
      if (current) {
        a.classList.add('nav-current');
        a.setAttribute('aria-current', 'page');
      } else {
        a.classList.remove('nav-current');
        a.removeAttribute('aria-current');
      }
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
