<!-- Injected into <head> of every page by _quarto.yml -->
<!-- Display + mono fonts used throughout the site and in the chord chart -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script>
  // THE SWITCH for the "bah" / solfege singing voice (rhythm-chant.js, solfege-sing.js and their buttons): true = hidden everywhere, false = as before.
  window.VOICE_HIDDEN = true;
  // MLT book recordings (apps/shared/mlt/recordings.js): the R2 bucket's public address, served by worker/index.js to logged-in browsers. Empty = players hidden.
  window.MLT_REC_BASE = "https://media.seancoleman.org";
</script>
<script>
  // One shared Supabase client for the whole site. The auth widget and the
  // tracker both reuse window.sb so there's a single session.
  window.sb = window.supabase.createClient(CONFIG.URL, CONFIG.ANON);
</script>
<!-- Session navigation: sets window.TOOL_CONFIG from URL params before any
     tool scripts run; injects a step banner when a session is active. -->
<script src="/apps/shared/session-nav.js"></script>
<!-- Where the site's own sound can be listened to (the navbar Tuner): sound sources register their output here. -->
<script src="/apps/shared/audio-tap.js?v=1"></script>
<!-- Long instruction paragraphs (*-hint, *-note) folded behind an eye button. -->
<script src="/apps/shared/help-eye.js?v=2"></script>
<script src="/apps/shared/works-cited-fold.js?v=1"></script>
<!-- MIDI learn: a pedal or key presses any button on the page (navbar "MIDI buttons"). -->
<script src="/apps/shared/midi-learn.js?v=1" defer></script>
<script>if(/\/lessons\//.test(location.pathname)){for(const f of["tool-catalog-data.js","tool-links.js"]){const s=document.createElement("script");s.src="/apps/shared/lessons/"+f+"?v=1";s.async=false;document.head.appendChild(s)}}</script>
<style>.tool-links{margin:2.5rem 0 1rem;padding:1rem 1.2rem;border:1px solid var(--bs-border-color);border-radius:.5rem;font-size:.92rem}.tool-links h2{font-size:1.05rem;margin:0 0 .5rem;border:0}.tool-links ul{margin:0 0 .5rem;padding-left:1.1rem}</style>
<!-- Click the number shown beside any slider to type a value. -->
<script src="/apps/shared/num-edit.js?v=1"></script>
<!-- Sheet music (abcjs) everywhere looks like the Notation page's score: Source Serif 4 text (crisp staff lines are opt-in: html.abc-crisp). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
<style>
svg[aria-label^="Sheet Music"] text,svg[aria-label^="Sheet Music"] tspan{font-family:"Source Serif 4",Georgia,serif!important;font-weight:400!important}
svg[aria-label^="Sheet Music"] .abcjs-title,svg[aria-label^="Sheet Music"] .abcjs-title tspan{font-weight:500!important}
/* Crisp staff lines: off (abcjs default drawing); some monitors drop or thicken lines with it. Add class "abc-crisp" to <html> to turn it back on. */
html.abc-crisp svg[aria-label^="Sheet Music"] .abcjs-staff,html.abc-crisp svg[aria-label^="Sheet Music"] .abcjs-staff-extra path,html.abc-crisp svg[aria-label^="Sheet Music"] .abcjs-bar,html.abc-crisp svg[aria-label^="Sheet Music"] .abcjs-ledger{shape-rendering:crispEdges}
</style>
